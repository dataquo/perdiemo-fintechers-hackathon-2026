[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "perdiemo-hackathon-mcp"
version = "0.2.0"
description = "Standalone, read-only MCP adapter for PerDiemo's REST calculation engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp[cli]>=2.0,<3.0",
  "pydantic>=2.0,<3.0",
  "requests>=2.31,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
